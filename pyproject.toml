[project]
name = "synology-cloud-sync-decrypt-tool"
version = "10.0.0"
description = "Open Source macOS GUI tool for decrypting Synology Cloud Sync encrypted files."
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Anojh Thayaparan" }]
dependencies = [
    "pycryptodomex>=3.20",
    "docopt>=0.6.2",
    "Pillow>=10.0.1",
    "lz4>=4.3.0",
]

[dependency-groups]
dev = [
    "pytest>=7",
    "assertpy>=1.1",
]
build = [
    "py2app>=0.28",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
